<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control de ingreso</title>
    <script src="https://unpkg.com/html5-qrcode"
            type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background: #f2f2f2;
        }
        h1 {
            margin-bottom: 20px;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
            background: white;
        }
        #resultado {
            margin: 20px auto;
            padding: 20px;
            max-width: 500px;
            border-radius: 10px;
            background: white;
        }
        .ok {
            background: #d4edda !important;
            color: #155724;
        }
        .error {
            background: #f8d7da !important;
            color: #721c24;
        }
    </style>
</head>

<body>
    <h1>Control de ingreso</h1>
    <div id="reader"></div>
    <div id="resultado">
        Esperando código QR...
    </div>

    <script>
        let scanner;
        async function qrDetectado(decodedText, decodedResult) {

    console.log("QR detectado:", decodedText);
    await scanner.clear();
    const resultado = document.getElementById("resultado");
    resultado.className = "";
    resultado.innerHTML = "⏳ Validando ingreso...";
    try {
        const urlAppsScript =
            "https://script.google.com/macros/s/AKfycbz30p3Mkc_cd9tzEOlAC-MioztcoJNcpBTo0IMaHQQEG9LTEKbotD2U0An6SfQ1unvy/exec";
        const url =
            urlAppsScript +
            "?id=" +
            encodeURIComponent(decodedText);
        const respuesta = await fetch(url);
        const datos = await respuesta.json();
        console.log("Respuesta:", datos);
        // AUTORIZADO
        if (datos.estado === "AUTORIZADO") {
            resultado.className = "ok";
            resultado.innerHTML = `
                <h2>✅ INGRESO AUTORIZADO</h2>
                <p>
                    <strong>
                        ${datos.nombre} ${datos.apellido}
                    </strong>
                </p>
                <p>
                    DNI: ${datos.dni}
                </p>
                <p>
                    Ingreso registrado correctamente.
                </p>
            `;
        }
        // YA REGISTRADO
        else if (datos.estado === "YA_REGISTRADO") {
            resultado.className = "error";
            resultado.innerHTML = `
                <h2>⚠️ YA REGISTRADO</h2>
                <p>
                    <strong>
                        ${datos.nombre} ${datos.apellido}
                    </strong>
                </p>
                <p>
                    Este código ya fue utilizado.
                </p>
            `;
        }
        // NO ENCONTRADO
        else if (datos.estado === "NO_ENCONTRADO") {
            resultado.className = "error";
            resultado.innerHTML = `
                <h2>❌ QR NO VÁLIDO</h2>
                <p>
                    La inscripción no existe.
                </p>
            `;
        }
        // OTRO ERROR
        else {
            resultado.className = "error";
            resultado.innerHTML = `
                <h2>❌ ERROR</h2>
                <p>
                    No se pudo validar el código.
                </p>
            `;
        }
    } catch (error) {
        console.error(error);
        resultado.className = "error";
        resultado.innerHTML = `
            <h2>❌ ERROR DE CONEXIÓN</h2>
            <p>
                No se pudo contactar con el servidor.
            </p>
        `;
    }
}

        scanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                }
            },
            false
        );

        scanner.render(qrDetectado);
    </script>
</body>
</html>
