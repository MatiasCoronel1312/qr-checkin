<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control de ingreso</title>
    <script src="https://unpkg.com/html5-qrcode"
            type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background: #f2f2f2;
        }
        h1 {
            margin-bottom: 20px;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
            background: white;
        }
        #resultado {
            margin: 20px auto;
            padding: 20px;
            max-width: 500px;
            border-radius: 10px;
            background: white;
        }
        .ok {
            background: #d4edda !important;
            color: #155724;
        }
        .error {
            background: #f8d7da !important;
            color: #721c24;
        }
    </style>
</head>

<body>
    <h1>Control de ingreso</h1>
    <div id="reader"></div>
    <div id="resultado">
        Esperando código QR...
    </div>

    <script>
        let scanner;
        function qrDetectado(decodedText, decodedResult) {
            console.log("QR detectado:", decodedText);
            scanner.clear();
            document.getElementById("resultado").innerHTML =
                "Código detectado:<br><strong>" +
                decodedText +
                "</strong>";
        }

        scanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                }
            },
            false
        );

        scanner.render(qrDetectado);
    </script>
</body>
</html>
